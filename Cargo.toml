[package]
name = "ricercar-jellyfin"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Jellyfin source plugin for the ricercar music player"
license = "MIT"
repository = "https://github.com/ricercar-player/ricercar-jellyfin"

[dependencies]
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
