name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  build:
    needs: test
    strategy:
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-latest
          - arch: aarch64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target ${{ matrix.arch }}-unknown-linux-musl
      - name: Package
        run: |
          cp target/${{ matrix.arch }}-unknown-linux-musl/release/ricercar-jellyfin jellyfin-${{ matrix.arch }}
          sha256sum jellyfin-${{ matrix.arch }} > jellyfin-${{ matrix.arch }}.sha256
          cat jellyfin-${{ matrix.arch }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: jellyfin-${{ matrix.arch }}
          path: jellyfin-${{ matrix.arch }}*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes "Static Linux builds. SHA-256 in the .sha256 files." \
            jellyfin-x86_64 jellyfin-aarch64 jellyfin-x86_64.sha256 jellyfin-aarch64.sha256
