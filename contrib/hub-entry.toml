# Entry for the ricercar plugin hub (github.com/ricercar-player/ricercar-plugins),
# as published in plugins/jellyfin.toml. On a new release, update `version`,
# the URLs and the SHA-256 from the release's .sha256 files.
id = "jellyfin"
name = "Jellyfin"
description = "Browse, search and play the music of your own Jellyfin server: albums, artists, playlists, favourites and folders, in ricercar's library next to your local music. Original files, bit for bit; transcode only when your DAC cannot take a file. Sign in with Quick Connect or your password."
author = "ricercar-player"
license = "MIT"
repository = "https://github.com/ricercar-player/ricercar-jellyfin"
version = "0.2.2"
protocol = 1
capabilities = ["auth", "browse", "search", "resolve", "favorites", "reporting", "library"]

